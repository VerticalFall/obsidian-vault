name: 每日报告同步 (Daily Reports Sync)

on:
  schedule:
    # 北京时间 12:20 = UTC 04:20。
    # GitHub Actions 定时任务通常会延迟数分钟到数小时,
    # 中午跑给上游(北京 8 点启动的源)留足缓冲。
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      today-override:
        description: '手动指定日期 (YYYY-MM-DD)，留空则用北京时间当天'
        required: false
        default: ''

permissions:
  contents: write         # 允许用内置 GITHUB_TOKEN 把报告提交回本仓库

concurrency:
  group: sync-reports
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出 vault 仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Python 依赖
        run: echo "纯标准库 + DeepSeek API,无需额外依赖"

      - name: 计算北京日期
        id: date
        run: |
          if [ -n "${{ inputs.today-override }}" ]; then
            echo "today=${{ inputs.today-override }}" >> "$GITHUB_OUTPUT"
          else
            echo "today=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: 抓取 AI HOT 日报
        continue-on-error: true
        env:
          RUN_DATE: ${{ steps.date.outputs.today }}
        run: python .github/scripts/render_aihot.py

      - name: 抓取 X 博主动态
        continue-on-error: true
        env:
          SOCIALDATA_API_KEY: ${{ secrets.SOCIALDATA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TODAY_OVERRIDE: ${{ steps.date.outputs.today }}
        run: python .github/scripts/render_xtweets.py

      - name: 抓取 FollowBuilders 动态
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TODAY_OVERRIDE: ${{ steps.date.outputs.today }}
        run: python .github/scripts/render_followbuilders.py

      - name: 抓取 TrendRadar 热点
        continue-on-error: true
        env:
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          db="https://raw.githubusercontent.com/VerticalFall/TrendRadar/master/output/news/${TODAY}.db"
          html="https://raw.githubusercontent.com/VerticalFall/TrendRadar/master/output/html/latest/daily.html"
          echo "尝试下载 db: $db"
          if curl -sfL "$db" -o /tmp/trendradar.db; then
            echo "db 下载成功,尝试下载 daily.html(含 AI 分析)..."
            curl -sfL "$html" -o /tmp/daily.html || echo "::warning::daily.html 未取到,本次仅渲染热榜。"
            python .github/scripts/render_trendradar.py "${TODAY}" /tmp/daily.html "TrendRadar" /tmp/trendradar.db
          else
            echo "::warning::TrendRadar 今日(${TODAY})数据库不存在,跳过。可能上游今天还没跑,或该源已停用。"
          fi

      - name: 自动日报路由 (DeepSeek V4 Flash)
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # deepseek-flash = V4.1 Flash（2026-09-10 上线）。旧名 deepseek-v4-flash
          # 仅作兼容路由，deepseek-v4-pro 已于 2026-09-14 起被路由到 V4.1 Flash，
          # deepseek-chat/reasoner 更早已于 2026-07-24 停用 —— 统一用当前名。
          ROUTER_MODEL: deepseek-flash
          # 输出预算：模型输出上限受 API 侧限制，设过头会整个请求 400。
          # 截断问题靠结构解决（选题池行改由脚本从路由日志确定性提取，
          # 模型不再重复生成 POOL_UPDATES 段），不靠加大这个值。
          ROUTER_MAX_TOKENS: "8192"
          TODAY_OVERRIDE: ${{ steps.date.outputs.today }}
          ROUTE_OUT_DIR: _路由
          TOPIC_FILE: _选题池.md
        run: python .github/scripts/run_daily_router.py

      - name: 每日精选 (四源 + 路由 → 一份当日精选)
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DIGEST_MODEL: deepseek-flash
          DIGEST_OUT_DIR: _每日精选
          # LLM 失败时脚本会自动产出「降级版精选」（机械提取，非归零）。
          # 若要在此期间直接跳过 LLM，取消下一行注释：
          # DIGEST_NO_LLM: "1"
          TODAY_OVERRIDE: ${{ steps.date.outputs.today }}
        run: python .github/scripts/render_daily_digest.py

      - name: L1 系统健康检查
        continue-on-error: true
        env:
          TODAY_OVERRIDE: ${{ steps.date.outputs.today }}
        run: python .github/scripts/check_health.py

      - name: 判断是否为周一
        id: weekday
        run: |
          DOW=$(TZ=Asia/Shanghai date +%u)
          if [ "$DOW" = "1" ]; then
            echo "is_monday=true" >> "$GITHUB_OUTPUT"
            echo "Monday detected — will run weekly distill"
          else
            echo "is_monday=false" >> "$GITHUB_OUTPUT"
            echo "Not Monday — skip weekly distill (DOW=$DOW)"
          fi

      - name: 周度蒸馏 Phase 1-2 (仅周一执行)
        if: steps.weekday.outputs.is_monday == 'true'
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ROUTER_MODEL: deepseek-flash
        run: python .github/scripts/run_weekly_distill.py

      - name: 提交并推送变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有新内容,跳过提交。"
          else
            git commit -m "chore: 同步每日报告 ${{ steps.date.outputs.today }}"
            git push
          fi

      # 告警落地：把健康报告 + 当日精选显示在 Actions 运行页。
      # 旧链路只把告警写进 _告警摘要.md，没人打开就等于没告警
      # （🔴 从 08-16 连报 40 天后才被发现）。
      - name: 告警与精选摘要（显示在运行页）
        if: always()
        continue-on-error: true
        run: |
          TODAY="${{ steps.date.outputs.today }}"
          {
            echo "## 📊 系统健康 · $TODAY"
            echo ""
            if [ -f "_系统健康/$TODAY.md" ]; then
              cat "_系统健康/$TODAY.md"
            else
              echo "⚠️ 未生成当日健康报告"
            fi
            echo ""
            echo "## 📰 每日精选 · $TODAY"
            echo ""
            if [ -f "_每日精选/$TODAY.md" ]; then
              cat "_每日精选/$TODAY.md"
            else
              echo "⚠️ 未生成当日精选（检查 DEEPSEEK_API_KEY 与各源产出）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
